---
- name: Download Elasticsearch .deb package from Yandex mirror
  ansible.builtin.get_url:
    url: "https://mirror.yandex.ru/mirrors/elastic/8/pool/main/e/elasticsearch/elasticsearch-8.11.0-amd64.deb"
    dest: "/tmp/elasticsearch-8.11.0-amd64.deb"
    mode: "0644"
    timeout: 120
    validate_certs: yes

- name: Install Elasticsearch from local .deb
  ansible.builtin.apt:
    deb: /tmp/elasticsearch-8.11.0-amd64.deb

- name: Ensure Elasticsearch config directory exists
  ansible.builtin.file:
    path: /etc/elasticsearch
    state: directory
    mode: '0755'
    owner: root
    group: elasticsearch

- name: Deploy elasticsearch.yml configuration
  ansible.builtin.template:
    src: elasticsearch.yml.j2
    dest: /etc/elasticsearch/elasticsearch.yml
    owner: root
    group: elasticsearch
    mode: '0640'
  notify: restart elasticsearch

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start Elasticsearch
  ansible.builtin.systemd:
    name: elasticsearch
    enabled: true
    state: started

- name: Clean up downloaded .deb file
  ansible.builtin.file:
    path: /tmp/elasticsearch-8.11.0-amd64.deb
    state: absent
  tags: cleanup